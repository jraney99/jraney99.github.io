# Merges Dependabot's GitHub Actions updates automatically (Jack approved 2026-10-26). Only Actions
# version bumps. pull_request_target gives the token write access for Dependabot's PRs; no PR code is
# checked out or run. The next daily publish run picks the change up, and a failed run emails Jack.
name: Merge build-tool updates
on: pull_request_target
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge
        run: gh pr merge --squash --delete-branch "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
