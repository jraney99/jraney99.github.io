name: Sync reading and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'   # daily, about 6 a.m. Central
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync Goodreads and Spotify
        if: github.event_name != 'push'
        env:
          GOODREADS_USER_ID: '205236304'
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python scripts/sync_goodreads.py
          python scripts/sync_spotify.py

      - name: Rebuild reading page
        run: python scripts/build_reading.py

      - name: Recalculate the $10-a-day bitcoin page (fetches prices on the daily run)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python scripts/build_dca.py --offline; else python scripts/build_dca.py; fi

      - name: Bitcoin halving lines from the live block height
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python scripts/build_chain.py --offline; else python scripts/build_chain.py; fi

      - name: Redraw Archibald jobs chart
        run: python scripts/build_archibald.py

      - name: Rebuild writing page and weekly posts
        run: python scripts/build_writing.py

      - name: Yearly ERCOT refresh (only does work once a new full year is published)
        if: github.event_name != 'push'
        run: |
          pip install --quiet openpyxl
          python scripts/build_ercot.py

      - name: Share images (home card each new ERCOT year, one per new post)
        env:
          CHROME: google-chrome
        run: python scripts/build_og.py

      - name: Rebuild golf page
        run: python scripts/build_golf.py

      - name: Apply facts from data/facts.json
        run: python scripts/build_facts.py

      - name: Rebuild résumé PDF if the résumé changed
        continue-on-error: true
        env:
          CHROME: google-chrome
        run: python scripts/build_resume_pdf.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git add -A
            git commit -m "Update generated content"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5

      # Fails the run (GitHub emails Jack) if the résumé PDF fell behind the résumé page. Runs after
      # deploy, so a PDF problem never blocks the rest of the site.
      - name: Check résumé PDF is current
        run: |
          test "$(sha256sum resume.html | cut -d' ' -f1)" = "$(cat resume/.source-hash)" || { echo "Résumé PDF is out of date"; exit 1; }
