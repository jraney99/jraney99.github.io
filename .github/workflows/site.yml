name: Sync reading and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * *'   # daily, about 6 a.m. Central
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Goodreads and Spotify
        if: github.event_name != 'push'
        env:
          GOODREADS_USER_ID: '205236304'
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python scripts/sync_goodreads.py
          python scripts/sync_spotify.py

      - name: Rebuild reading page
        run: python scripts/build_reading.py

      - name: Apply facts from data/facts.json
        run: python scripts/build_facts.py

      - name: Rebuild résumé PDF if the résumé changed
        continue-on-error: true
        env:
          CHROME: google-chrome
        run: python scripts/build_resume_pdf.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git add -A
            git commit -m "Update generated content"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
